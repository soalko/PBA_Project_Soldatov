<article class="card entity-card mb-3">
    <div class="card-body d-flex justify-content-between align-items-center gap-2">
        <div>
            <h2 class="card-title h5">
                {{ artist.name|default:"Без имени" }}
            </h2>
            <p class="card-text text-muted mb-0">
                {{ artist.country|default:"страна не указана" }}
            </p>
        </div>
        <div class="text-end">
            <span class="badge bg-info genre-badge">
                {{ artist.genre|capfirst }}
            </span>
            <a
                href="{% url 'artists:detail' artist.id %}"
                class="btn btn-sm btn-primary ms-2"
            >
                Подробнее
            </a>
        </div>
    </div>
</article>
